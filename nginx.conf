# ═══════════════════════════════════════════════════════════════════════════
# Nginx config snippet for vucse.app
#
# Deployment map:
#   https://vucse.app/oath      → static files in /var/www/ai-pledge/
#   https://vucse.app/APO/*     → Node.js API on localhost:6003
#
# HOW TO USE ON THE SERVER:
#   1. Copy this file to /etc/nginx/sites-available/ai-pledge
#   2. ln -s /etc/nginx/sites-available/ai-pledge /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#
# NOTE: If vucse.app already has a server block in another config,
#       add only the two location blocks below into your existing server{} block
#       and skip the outer server{} wrapper here.
# ═══════════════════════════════════════════════════════════════════════════

# ── Cache-control map (used in /oath static block) ────────────────────────
# Admin assets get no-cache; other static assets get aggressive caching.
# This avoids nested add_header blocks that would shadow security headers.
map $uri $oath_cache_control {
    ~*^/oath/admin\.(css|js)$   "no-store, no-cache, must-revalidate";
    ~*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$  "public, max-age=2592000, immutable";
    default                     "";
}

map $uri $oath_pragma {
    ~*^/oath/admin\.(css|js)$   "no-cache";
    default                     "";
}



server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vucse.app;

    # ── SSL (Certbot will manage these paths) ──────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/vucse.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vucse.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────────────────
    # These apply globally. Because we no longer use add_header in child
    # blocks (we use map variables instead), these are properly inherited.
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── /APO — Node.js API (port 6003) ────────────────────────────────────
    # Exact match: bare /APO without trailing slash → redirect to /APO/
    # This prevents /APOfoo or /APO-bar from matching the prefix block.
    location = /APO {
        return 302 /APO/;
    }

    # Prefix match: /APO/ and everything beneath it → proxy to Express
    location /APO/ {
        proxy_pass         http://127.0.0.1:6003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ── Admin dashboard (admin1 to avoid conflicts with oath page) ──────────
    location = /admin1 {
        return 302 /oath/admin1;
    }

    location = /oath.admin1 {
        return 302 /oath/admin1;
    }

    location = /oath/admin1 {
        # Exact-match location with its own add_header directives.
        # Re-declare security headers so they aren't silently dropped.
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
        alias /var/www/ai-pledge/admin.html;
    }

    location = /oath/admin1.html {
        return 302 /oath/admin1;
    }

    # Legacy admin redirects (redirect old admin URLs to new admin1)
    location = /admin {
        return 302 /oath/admin1;
    }

    location = /oath/admin {
        return 302 /oath/admin1;
    }

    location = /oath.admin {
        return 302 /oath/admin1;
    }

    # ── /oath — Static frontend files ─────────────────────────────────────
    # Browser requests https://vucse.app/oath   → serves index.html
    # Browser requests https://vucse.app/oath/* → serves matching static file
    #
    # IMPORTANT DESIGN NOTES:
    # • `try_files` does NOT work with `alias` — it resolves $uri against
    #   `root`, not the alias path, causing false 404s on every static file.
    # • SPA fallback uses `error_page 404` → an exact-match location for
    #   /oath/index.html. The exact match serves the file directly via its
    #   own `alias` directive, so there is no re-entry into the prefix
    #   location and therefore no redirect loop.
    # • `expires` does not accept variables, so max-age is embedded in the
    #   $oath_cache_control map value instead.

    # Bare /oath (no trailing slash) → add it so alias maps cleanly
    location = /oath {
        return 302 /oath/;
    }

    # Exact match: SPA entry point — serves index.html directly.
    # This is the target of error_page 404 below.  Because it is an
    # exact-match location with its own alias, it can never loop.
    location = /oath/index.html {
        alias /var/www/ai-pledge/index.html;

        add_header Cache-Control $oath_cache_control always;
        add_header Pragma        $oath_pragma        always;

        # Re-declare security headers (add_header above shadows server-level ones)
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # Prefix match: all other /oath/ requests → static files
    location /oath/ {
        alias /var/www/ai-pledge/;
        index index.html;

        # Cache headers driven by map variables
        add_header Cache-Control $oath_cache_control always;
        add_header Pragma        $oath_pragma        always;

        # Re-declare security headers since add_header above shadows them
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # SPA fallback: if the file doesn't exist, serve index.html.
        # The `= /oath/index.html` subrequest hits the exact-match location
        # above, which resolves via its own alias — no loop possible.
        error_page 404 = /oath/index.html;
    }

    # ── Root redirect (optional) ───────────────────────────────────────────
    location = / {
        return 302 /oath;
    }
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name vucse.app;
    return 301 https://$host$request_uri;
}
