# ═══════════════════════════════════════════════════════════════════════════
# Nginx config snippet for vucse.app
#
# Deployment map:
#   https://vucse.app/oath      → static files in /var/www/ai-pledge/
#   https://vucse.app/APO/*     → Node.js API on localhost:6003
#
# HOW TO USE ON THE SERVER:
#   1. Copy this file to /etc/nginx/sites-available/ai-pledge
#   2. ln -s /etc/nginx/sites-available/ai-pledge /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#
# NOTE: If vucse.app already has a server block in another config,
#       add only the two location blocks below into your existing server{} block
#       and skip the outer server{} wrapper here.
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vucse.app;

    # ── SSL (Certbot will manage these paths) ──────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/vucse.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vucse.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── /APO — Node.js API (port 6003) ────────────────────────────────────
    # All API calls from the browser hit https://vucse.app/APO/*
    # nginx strips nothing — passes /APO/register etc. straight to Express
    location /APO {
        proxy_pass         http://127.0.0.1:6003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ── Admin dashboard shortcuts ─────────────────────────────────────────
    location = /admin {
        return 302 /oath/admin;
    }

    location = /oath.admin {
        return 302 /oath/admin;
    }

    location = /oath/admin {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
        alias /var/www/ai-pledge/admin.html;
    }

    location = /oath/admin.html {
        return 302 /oath/admin;
    }

    # ── /oath — Static frontend files ─────────────────────────────────────
    # Browser requests https://vucse.app/oath   → serves index.html
    # Browser requests https://vucse.app/oath/* → serves matching static file
    location /oath {
        alias /var/www/ai-pledge/;
        index index.html;

        # Admin assets - no cache
        location ~* /oath/(admin\.(css|js))$ {
            alias /var/www/ai-pledge/;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires off;
            try_files $uri =404;
        }

        # Cache static assets aggressively (except admin)
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            alias /var/www/ai-pledge/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback — unknown paths serve index.html
        try_files $uri $uri/ /oath/index.html;
    }

    # ── Root redirect (optional) ───────────────────────────────────────────
    location = / {
        return 302 /oath;
    }
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name vucse.app;
    return 301 https://$host$request_uri;
}
