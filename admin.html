<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Admin Dashboard - AI Ethics Pledge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- ── Login View ─────────────────────────────────────────── -->
    <div id="loginModal" class="login-modal-overlay">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">🔐</div>
                <h2>Admin Authentication</h2>
                <p>Enter the administrator password to access the AI Ethics Pledge dashboard and member controls.</p>
            </div>
            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label for="adminPasswordInput">Admin Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="adminPasswordInput" 
                            placeholder="Enter password..." 
                            required 
                            autocomplete="current-password"
                            autofocus
                        />
                        <button type="button" class="btn-toggle-pwd" onclick="togglePasswordVisibility()" title="Toggle visibility">
                            👁️
                        </button>
                    </div>
                </div>
                <div id="loginErrorMsg" class="login-error" style="display: none;"></div>
                <button type="submit" id="loginBtn" class="btn-login">
                    <span>🔓 Sign In to Dashboard</span>
                </button>
            </form>
            <div class="login-footer">
                <small>Protected Area • Unauthorized access prohibited</small>
            </div>
        </div>
    </div>

    <!-- ── Dynamic Authenticated Dashboard Mount Point ────────── -->
    <div id="adminRoot"></div>

    <!-- ── Confirmation Action Modal ──────────────────────────── -->
    <div id="confirmModal" class="confirm-modal-overlay" style="display: none;">
        <div class="confirm-card">
            <div class="confirm-icon" id="confirmIcon">⚠️</div>
            <h3 id="confirmTitle">Confirm Action</h3>
            <p id="confirmMessage">Are you sure you want to perform this action?</p>
            <div class="confirm-details" id="confirmDetails"></div>
            <div class="confirm-actions">
                <button class="btn-cancel" onclick="closeConfirmModal()">Cancel</button>
                <button id="confirmExecuteBtn" class="btn-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
